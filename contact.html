<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <!-- Primary Meta Tags -->
        <title>Contact | Carlier</title>
        <meta name="title" content="Contact | Carlier">
        <meta name="description" content="Get in touch with Carlier for software engineering and product development inquiries.">
        <meta name="author" content="Carlier">
        <meta name="robots" content="index, follow">
        <link rel="canonical" href="https://carlier.site/contact.html">

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://carlier.site/contact.html">
        <meta property="og:title" content="Contact | Carlier">
        <meta property="og:description" content="Get in touch with Carlier for software engineering and product development inquiries.">

        <!-- Twitter -->
        <meta property="twitter:card" content="summary">
        <meta property="twitter:url" content="https://carlier.site/contact.html">
        <meta property="twitter:title" content="Contact | Carlier">
        <meta property="twitter:description" content="Get in touch with Carlier for software engineering and product development inquiries.">

        <!-- Favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="images/Carlier_logo_512x512.png">
        <link rel="icon" type="image/png" href="images/Carlier_logo_160x160.png">
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link rel="icon" type="image/png" sizes="512x512" href="images/Carlier_logo_512x512.png">
        <meta name="theme-color" content="#171719">

        <!-- Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet">

        <style>
            :root {
                --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;

                --chrome: #171719;
                --bg: #09090b;
                --elevated: #2b2d30;
                --border: #2b2d30;
                --border2: #43454a;
                --text: #dfe1e5;
                --muted: #a8adb5;
                --hint: #71757c;
                --accent: #8dff4f;
                --on-accent: #0a0a0a;
                --red: #ff4b75;

                color-scheme: dark;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.6;
                color: var(--text);
                background: var(--chrome);
                -webkit-font-smoothing: antialiased;
            }

            a {
                color: var(--accent);
                text-decoration: none;
                transition: color .15s ease-out;
            }

            a:hover {
                color: color-mix(in srgb, var(--accent) 85%, white);
                text-decoration: underline;
            }

            .container {
                max-width: 700px;
                margin: 0 auto;
                padding: 60px 40px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .back-link {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 32px;
                font-size: 14px;
                color: var(--muted);
            }

            .back-link:hover {
                color: var(--text);
            }

            .back-link svg {
                width: 16px;
                height: 16px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2px;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .form-card {
                width: 100%;
                padding: 48px 40px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--elevated);
            }

            .form-card h1 {
                font-family: var(--font-sans);
                font-size: 24px;
                font-weight: 700;
                margin: 0 0 8px;
                color: var(--text);
            }

            .form-card p {
                font-size: 15px;
                color: var(--muted);
                margin: 0 0 32px;
                line-height: 1.7;
            }

            .form-group {
                margin-bottom: 24px;
            }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                font-size: 13px;
                font-weight: 500;
                color: var(--text);
            }

            .form-group input,
            .form-group textarea {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--border2);
                border-radius: 4px;
                background: var(--bg);
                color: var(--text);
                font-family: inherit;
                font-size: 14px;
                line-height: 1.5;
            }

            .form-group input:focus,
            .form-group textarea:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
            }

            .form-group input::placeholder,
            .form-group textarea::placeholder {
                color: var(--hint);
            }

            .form-group textarea {
                min-height: 140px;
                resize: vertical;
            }

            .form-group.full-width {
                grid-column: 1 / -1;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 12px 24px;
                border: 1px solid var(--accent);
                border-radius: 4px;
                background: var(--accent);
                color: var(--on-accent);
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                cursor: pointer;
                transition: background .15s ease-out, border-color .15s ease-out;
            }

            .btn:hover {
                background: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                border-color: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                color: var(--on-accent);
            }

            .btn:disabled {
                opacity: .5;
                cursor: not-allowed;
            }

            .btn svg {
                width: 16px;
                height: 16px;
            }

            .success-message {
                display: none;
                padding: 20px;
                border-radius: 4px;
                background: color-mix(in srgb, var(--accent) 10%, transparent);
                border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
                color: var(--accent);
                text-align: center;
            }

            .success-message p {
                margin: 0;
                font-size: 15px;
            }

            .success-message svg {
                width: 24px;
                height: 24px;
                margin-bottom: 8px;
            }

            .footer {
                margin-top: auto;
                padding: 40px 40px 20px;
                text-align: center;
                font-size: 13px;
                color: var(--hint);
            }

            .footer p {
                margin: 0;
            }

            .error {
                color: var(--red);
                font-size: 12px;
                margin-top: 4px;
                display: none;
            }

            @media (max-width: 600px) {
                .container {
                    padding: 40px 20px;
                }

                .form-card {
                    padding: 32px 24px;
                }

                .form-card h1 {
                    font-size: 20px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <a href="./" class="back-link">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
                Back to home
            </a>

            <div class="form-card">
                <h1>Get in touch</h1>
                <p>Fill out the form below and we'll get back to you as soon as possible.</p>

                <div id="contact-form">
                    <form id="form" method="POST">
                        <input type="hidden" name="form-name" value="contact">

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your name" required>
                        </div>

                        <div class="form-group">
                            <label for="company">Company (optional)</label>
                            <input type="text" id="company" name="company" placeholder="Company name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
                        </div>

                        <button type="submit" class="btn" id="submit-btn">
                            Send message
                        </button>
                    </form>
                </div>

                <div class="success-message" id="success-message" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"></path>
                    </svg>
                    <p>Thank you! Your message has been sent.</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Carlier. All rights reserved.</p>
        </div>

        <script>
            (() => {
                const form = document.getElementById('form');
                const successMessage = document.getElementById('success-message');
                const submitBtn = document.getElementById('submit-btn');

                if (!form || !successMessage || !submitBtn) return;

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Sending...';

                    try {
                        // For now, simulate submission
                        // Replace with actual form endpoint when configured
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        
                        form.hidden = true;
                        successMessage.hidden = false;
                    } catch (error) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Send message';
                        alert('There was an error. Please try again later.');
                    }
                });
            })();
        </script>
    </body>

</html>
