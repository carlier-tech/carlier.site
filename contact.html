<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <!-- Primary Meta Tags -->
        <title>Contact | Carlier</title>
        <meta name="title" content="Contact | Carlier">
        <meta name="description" content="Get in touch with Carlier for software engineering and product development inquiries.">
        <meta name="author" content="Carlier">
        <meta name="robots" content="index, follow">
        <link rel="canonical" href="https://carlier.site/contact.html">

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://carlier.site/contact.html">
        <meta property="og:title" content="Contact | Carlier">
        <meta property="og:description" content="Get in touch with Carlier for software engineering and product development inquiries.">
        <meta property="og:image" content="https://carlier.site/images/og-1200x630.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Carlier — Contact Us">
        <meta property="og:site_name" content="Carlier">

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image">
        <meta property="twitter:url" content="https://carlier.site/contact.html">
        <meta property="twitter:title" content="Contact | Carlier">
        <meta property="twitter:description" content="Get in touch with Carlier for software engineering and product development inquiries.">
        <meta property="twitter:image" content="https://carlier.site/images/og-1200x630.png">

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
        <meta name="theme-color" content="#171719">

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="shared/site.css">

        <style>
            /* Contact page */
            .back-link {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 32px;
                font-size: 14px;
                color: var(--muted);
            }

            .back-link:hover {
                color: var(--text);
                text-decoration: none;
            }

            .back-link svg {
                width: 16px;
                height: 16px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2px;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .form-card {
                width: 100%;
                padding: 48px 40px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--elevated);
            }

            .form-card h1 {
                font-family: var(--font-sans);
                font-size: 24px;
                font-weight: 700;
                margin: 0 0 8px;
                color: var(--text);
                letter-spacing: 0;
            }

            .form-card p {
                font-size: 15px;
                color: var(--muted);
                margin: 0 0 32px;
                line-height: 1.7;
            }

            .success-message {
                display: none;
                padding: 20px;
                border-radius: 4px;
                background: color-mix(in srgb, var(--accent) 10%, transparent);
                border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
                color: var(--accent);
                text-align: center;
            }

            .success-message p {
                margin: 0;
                font-size: 15px;
            }

            .success-message svg {
                width: 24px;
                height: 24px;
                margin: 0 auto 8px;
            }

            .error {
                color: var(--danger);
                font-size: 12px;
                margin-top: 4px;
                display: none;
            }

            @media (max-width: 600px) {
                .form-card {
                    padding: 32px 24px;
                }

                .form-card h1 {
                    font-size: 20px;
                }
            }
        </style>
        <!-- Schema.org JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "ContactPage",
            "name": "Contact Carlier",
            "url": "https://carlier.site/contact.html",
            "description": "Get in touch with Carlier for software engineering and product development inquiries.",
            "publisher": {
                "@type": "Organization",
                "name": "Carlier",
                "url": "https://carlier.site/",
                "logo": {
                    "@type": "ImageObject",
                    "url": "https://carlier.site/images/Carlier_logo_512x512.webp"
                }
            }
        }
        </script>
    </head>

    <body>
        <div class="container container--narrow">
            <a href="./" class="back-link">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
                Back to home
            </a>

            <div class="form-card">
                <h1>Get in touch</h1>
                <p>Fill out the form below and we'll get back to you as soon as possible.</p>

                <div id="contact-form">
                    <form id="form" method="POST">
                        <input type="hidden" name="form-name" value="contact">

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your name" required>
                        </div>

                        <div class="form-group">
                            <label for="company">Company (optional)</label>
                            <input type="text" id="company" name="company" placeholder="Company name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
                        </div>

                        <button type="submit" class="btn" id="submit-btn">
                            Send message
                        </button>
                    </form>
                </div>

                <div class="success-message" id="success-message" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"></path>
                    </svg>
                    <p>Thank you! Your message has been sent.</p>
                </div>
            </div>

            <div class="footer">
                <p>&copy; 2026 Carlier. All rights reserved.</p>
            </div>
        </div>

        <script>
            (() => {
                const form = document.getElementById('form');
                const successMessage = document.getElementById('success-message');
                const submitBtn = document.getElementById('submit-btn');

                if (!form || !successMessage || !submitBtn) return;

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Sending...';

                    try {
                        // For now, simulate submission
                        // Replace with actual form endpoint when configured
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        
                        form.hidden = true;
                        successMessage.hidden = false;
                    } catch (error) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Send message';
                        alert('There was an error. Please try again later.');
                    }
                });
            })();
        </script>
    </body>

</html>
