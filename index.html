        <style>
            :root {
                --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;
                --font-display: "Orbitron", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

                --chrome: #171719;
                --bg: #09090b;
                --elevated: #2b2d30;
                --border: #2b2d30;
                --border2: #43454a;
                --text: #dfe1e5;
                --muted: #a8adb5;
                --hint: #71757c;
                --accent: #8dff4f;
                --on-accent: #0a0a0a;

                color-scheme: dark;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.6;
                color: var(--text);
                background: var(--chrome);
                -webkit-font-smoothing: antialiased;
            }

            a {
                color: var(--accent);
                text-decoration: none;
                transition: color .15s ease-out;
            }

            a:hover {
                color: color-mix(in srgb, var(--accent) 85%, white);
                text-decoration: underline;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 80px 40px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .nav-container {
                width: 100%;
                margin-bottom: 40px;
            }

            nav {
                display: flex;
                gap: 24px;
                justify-content: center;
                font-size: 15px;
                font-weight: 500;
            }

            nav a {
                color: var(--text);
                padding: 8px 0;
                border-bottom: 2px solid transparent;
                transition: border-color .15s ease-out, color .15s ease-out;
            }

            nav a:hover {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }

            .company-card {
                width: 100%;
                max-width: 500px;
                padding: 60px 50px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--elevated);
                text-align: center;
            }

            .company-logo {
                width: 100px;
                height: 100px;
                margin: 0 auto 24px;
                border-radius: 8px;
            }

            .company-name {
                font-family: var(--font-display);
                font-size: 32px;
                font-weight: 500;
                color: var(--accent);
                margin: 0;
                letter-spacing: .5px;
            }

            .company-cta {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 24px;
                border: 1px solid var(--accent);
                border-radius: 4px;
                background: var(--accent);
                color: var(--on-accent);
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                text-decoration: none;
                transition: background .15s ease-out, border-color .15s ease-out;
                margin-top: 24px;
            }

            .company-cta:hover {
                background: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                border-color: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                color: var(--on-accent);
            }

            .footer {
                margin-top: 60px;
                padding: 20px 40px;
                text-align: center;
                font-size: 13px;
                color: var(--hint);
            }

            .footer p {
                margin: 0;
            }

            .hero h1 {
                font-family: var(--font-display);
                font-size: 32px;
                font-weight: 500;
                color: var(--accent);
                margin: 0 0 16px;
                letter-spacing: .5px;
            }

            @media (max-width: 600px) {
                .container {
                    padding: 40px 20px;
                }

                .nav-container {
                    margin-bottom: 30px;
                }

                nav {
                    gap: 16px;
                    font-size: 14px;
                }

                .company-card {
                    padding: 40px 30px;
                }

                .company-logo {
                    width: 80px;
                    height: 80px;
                }

                .company-name {
                    font-size: 24px;
                }
            }
        </style>
        <style>
            :root {
                --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;
                --font-display: "Orbitron", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

                --chrome: #171719;
                --bg: #09090b;
                --elevated: #2b2d30;
                --border: #2b2d30;
                --border2: #43454a;
                --text: #dfe1e5;
                --muted: #a8adb5;
                --hint: #71757c;
                --accent: #8dff4f;
                --on-accent: #0a0a0a;

                color-scheme: dark;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.6;
                color: var(--text);

                -webkit-font-smoothing: antialiased;
            }

            a {
                color: var(--accent);
                text-decoration: none;
                transition: color .15s ease-out;
            }

            a:hover {
                color: color-mix(in srgb, var(--accent) 85%, white);
                text-decoration: underline;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 60px 40px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .nav-container {
                width: 100%;
                margin-bottom: 40px;
            }

            nav {
                display: flex;
                gap: 24px;
                justify-content: center;
                font-size: 15px;
                font-weight: 500;
            }

            nav a {
                color: var(--text);
                padding: 8px 0;
                border-bottom: 2px solid transparent;
                transition: border-color .15s ease-out, color .15s ease-out;
            }

            nav a:hover {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }

            .hero {
                text-align: center;
                margin-bottom: 60px;
            }

            .hero h1 {
                font-family: var(--font-display);
                font-size: 32px;
                font-weight: 500;
                color: var(--accent);
                margin: 0 0 16px;
                letter-spacing: .5px;
            }

            .hero p {
                font-size: 16px;
                color: var(--muted);
                max-width: 600px;
                margin: 0 auto;
            }

            .grid {
                display: grid;
                gap: 24px;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }

            .card {
                background: var(--elevated);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 24px;
                transition: border-color .15s ease-out, transform .15s ease-out;
            }

            .card:hover {
                border-color: var(--accent);
                transform: translateY(-2px);
            }

            .card img {
                width: 100%;
                height: auto;
                border-radius: 6px;
                display: block;
                margin-bottom: 16px;
            }

            .card h2 {
                font-size: 18px;
                font-weight: 600;
                margin: 0 0 8px;
                color: var(--text);
            }

            .card h2 a {
                color: var(--text);
            }

            .card h2 a:hover {
                color: var(--accent);
            }

            .card p {
                margin: 0 0 16px;
                color: var(--muted);
                font-size: 14px;
            }

            .badge-row {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .badge-row a {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--accent);
                border-radius: 4px;
                background: var(--accent);
                color: var(--on-accent);
                font-size: 12px;
                font-weight: 500;
            }

            .badge-row a:hover {
                background: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                border-color: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                color: var(--on-accent);
            }

            .family-section {
                margin-top: 60px;
                text-align: center;
            }

            .family-section h2 {
                font-size: 20px;
                font-weight: 600;
                margin: 0 0 12px;
                color: var(--text);
            }

            .family-section p {
                margin: 0;
                color: var(--muted);
                font-size: 15px;
            }

            .footer {
                margin-top: auto;
                padding: 40px 40px 20px;
                text-align: center;
                font-size: 13px;
                color: var(--hint);
                border-top: 1px solid var(--border);
            }

            .footer p {
                margin: 0 0 8px;
            }

            .footer-links {
                display: flex;
                gap: 24px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .footer-links a {
                color: var(--muted);
                font-size: 13px;
            }

            .footer-links a:hover {
                color: var(--accent);
            }

            @media (max-width: 600px) {
                .container {
                    padding: 40px 20px;
                }

                .nav-container {
                    margin-bottom: 30px;
                }

                nav {
                    gap: 16px;
                    font-size: 14px;
                }

                .hero h1 {
                    font-size: 24px;
                }

                .hero p {
                    font-size: 15px;
                }

                .grid {
                    gap: 16px;
                }

                .card {
                    padding: 16px;
                }

                .footer {
                    padding: 30px 20px 16px;
                }

                .footer-links {
                    gap: 16px;
                }
            }
        </style>
