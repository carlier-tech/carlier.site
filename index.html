        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">

            rel="stylesheet">

        <style>
            :root {
                --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;
                --font-display: "Orbitron", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

                --chrome: #171719;
                --bg: #09090b;
                --elevated: #2b2d30;
                --border: #2b2d30;
                --border2: #43454a;
                --text: #dfe1e5;
                --muted: #a8adb5;
                --hint: #71757c;
                --accent: #8dff4f;
                --on-accent: #0a0a0a;

                color-scheme: dark;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.6;
                color: var(--text);
                background: var(--chrome);
                -webkit-font-smoothing: antialiased;
            }

            a {
                color: var(--accent);
                text-decoration: none;
                transition: color .15s ease-out;
            }

            a:hover {
                color: color-mix(in srgb, var(--accent) 85%, white);
                text-decoration: underline;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 80px 40px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .company-card {
                width: 100%;
                max-width: 500px;
                padding: 60px 50px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--elevated);
                text-align: center;
            }

            .company-logo {
                width: 100px;
                height: 100px;
                margin: 0 auto 24px;
                border-radius: 8px;
            }

            .company-name {
                font-family: var(--font-display);
                font-size: 28px;
                font-weight: 500;
                color: var(--accent);
                margin: 0;
                letter-spacing: .5px;
            }

            .company-cta {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 24px;
                border: 1px solid var(--accent);
                border-radius: 4px;
                background: var(--accent);
                color: var(--on-accent);
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                text-decoration: none;
                transition: background .15s ease-out, border-color .15s ease-out;
                margin-top: 24px;
            }

            .company-cta:hover {
                background: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                border-color: color-mix(in srgb, var(--accent) 85%, var(--on-accent));
                color: var(--on-accent);
            }

            .footer {
                margin-top: 60px;
                padding: 20px 40px;
                text-align: center;
                font-size: 13px;
                color: var(--hint);
            }

            .footer p {
                margin: 0;
            }

            @media (max-width: 600px) {
                .container {
                    padding: 40px 20px;
                }

                .company-card {
                    padding: 40px 30px;
                }

                .company-logo {
                    width: 80px;
                    height: 80px;
                }

                .company-name {
                    font-size: 24px;
                }
            }
        </style>

        <!-- Schema.org JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "@id": "https://carlier.site/#organization",
                    "name": "Carlier",
                    "url": "https://carlier.site/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://carlier.site/images/Carlier_logo_512x512.webp"
                    },
                    "description": "Software engineering and product development spanning mobile, web, AI systems, cybersecurity, and infrastructure"
                },
                {
                    "@type": "WebSite",
                    "@id": "https://carlier.site/#website",
                    "url": "https://carlier.site/",
                    "name": "Carlier | Software Engineering & Product Development",
                    "description": "Software engineering and product development spanning mobile, web, AI systems, cybersecurity, and infrastructure"
                }
            ]
        }
        </script>
    </head>
